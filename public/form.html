<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Camp Aaron Elective Selections</title>
<style>
  :root {
    --bg: #f7f5f0; --card: #ffffff; --ink: #1f2937; --muted: #6b7280;
    --accent: #2563eb; --accent-ink: #ffffff; --border: #e5e7eb;
    --danger: #dc2626; --danger-bg: #fef2f2; --ok: #059669; --ok-bg: #ecfdf5;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         background: var(--bg); color: var(--ink); line-height: 1.4; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 20px 16px 80px; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 0.92rem; margin-bottom: 20px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px;
          padding: 16px; margin-bottom: 14px; }
  .slot-title { font-weight: 600; margin-bottom: 10px; font-size: 1rem; }
  .rank-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .rank-row label { width: 68px; font-size: 0.85rem; color: var(--muted); flex-shrink: 0; }
  select, input[type=text] { flex: 1; padding: 9px 10px; border-radius: 8px; border: 1px solid var(--border);
          font-size: 0.95rem; background: #fff; color: var(--ink); width: 100%; }
  .required-mark { color: var(--danger); }
  .swim-toggle { display: flex; align-items: center; gap: 10px; }
  .swim-toggle input { width: auto; flex: none; }
  button.submit { background: var(--accent); color: var(--accent-ink); border: none; border-radius: 10px;
          padding: 14px 20px; font-size: 1.05rem; font-weight: 600; width: 100%; cursor: pointer; }
  button.submit:disabled { opacity: 0.6; cursor: not-allowed; }
  .msg { border-radius: 10px; padding: 12px 14px; margin-bottom: 16px; font-size: 0.92rem; }
  .msg.error { background: var(--danger-bg); color: var(--danger); }
  .msg.ok { background: var(--ok-bg); color: var(--ok); }
  .friend-help { font-size: 0.82rem; color: var(--muted); margin: 4px 0 10px; }
  .section-title { font-size: 1.05rem; font-weight: 700; margin: 28px 0 10px; }
  .incomplete-badge { display: inline-block; background: var(--danger-bg); color: var(--danger);
          font-size: 0.75rem; padding: 2px 8px; border-radius: 999px; margin-left: 8px; }
  .center { text-align: center; padding: 60px 20px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="center">Loading…</div>
</div>

<script>
(function () {
  const params = new URLSearchParams(location.search);
  const camp = params.get("camp") || "default";
  const camperId = params.get("c");
  const apiBase = params.get("api") || "https://camp-aaron-scheduler-backend.netlify.app/exec";

  const app = document.getElementById("app");

  function api(action, opts) {
    opts = opts || {};
    if (opts.method === "POST") {
      return fetch(apiBase, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(Object.assign({ action, camp }, opts.body || {})),
      }).then((r) => r.json());
    }
    const qs = new URLSearchParams(Object.assign({ action, camp }, opts.query || {}));
    return fetch(apiBase + "?" + qs.toString()).then((r) => r.json());
  }

  function render(html) { app.innerHTML = html; }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  if (!camperId) {
    render('<div class="msg error">This link is missing a camper id. Please use the personal link sent to your family, or contact camp staff.</div>');
    return;
  }

  Promise.all([
    fetch("slots.json").then((r) => r.json()),
    api("loadRoster"),
    api("loadPreferences", { query: { camper_id: camperId } }),
  ]).then(([slotsData, rosterResp, prefsResp]) => {
    if (!rosterResp.ok) {
      render('<div class="msg error">Could not load the camp roster. Please try again shortly.</div>');
      return;
    }
    const roster = rosterResp.roster || [];
    const me = roster.find((c) => c.camper_id === camperId);
    if (!me) {
      render('<div class="msg error">We couldn\'t find that camper. Please use the personal link sent to your family, or contact camp staff.</div>');
      return;
    }

    const division = me.division;
    const divData = slotsData.divisions[division];
    if (!divData) {
      render('<div class="msg error">Unknown division "' + escapeHtml(division) + '" for this camper. Please contact camp staff.</div>');
      return;
    }

    const existing = (prefsResp.ok && prefsResp.submission) || null;
    const otherCampers = roster.filter((c) => c.camper_id !== camperId);
    const nameFor = (id) => {
      const c = roster.find((r) => r.camper_id === id);
      return c ? c.name : "";
    };

    function eligible(opt, grade, gender) {
      if (opt.grade_lo != null && grade < opt.grade_lo) return false;
      if (opt.grade_hi != null && grade > opt.grade_hi) return false;
      if (opt.gender !== "MF" && opt.gender !== gender) return false;
      return true;
    }

    let swimAlt = existing ? !!existing.swim_alt : false;

    function slotsForCamper() {
      let slots = divData.slots.slice();
      if (divData.swim_alt_eligible && swimAlt) {
        const menu = divData.swim_alt_menu || {};
        const periods = divData.swim_period || {};
        Object.keys(periods).forEach((day) => {
          const names = menu[day] || [];
          if (!names.length) return;
          slots.push({
            slot_id: division + ":" + day + ":" + periods[day] + ":swimalt",
            day: day,
            period: periods[day],
            options: names.map((n) => ({ base: n, grade_lo: null, grade_hi: null, gender: "MF" })),
          });
        });
        const dayOrder = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"];
        slots.sort((a, b) => {
          const d = dayOrder.indexOf(a.day) - dayOrder.indexOf(b.day);
          if (d !== 0) return d;
          return parseInt(a.period, 10) - parseInt(b.period, 10);
        });
      }
      return slots;
    }

    function slotCard(slot) {
      const opts = slot.options
        .filter((o) => eligible(o, me.grade, me.gender || "MF"))
        .map((o) => o.base)
        .sort();
      const savedRanks = (existing && existing.preferences && existing.preferences[slot.slot_id]) || [];
      const rankSelect = (rankIdx) => {
        const current = savedRanks[rankIdx] || "";
        const label = rankIdx === 0 ? "1st choice" : rankIdx === 1 ? "2nd choice" : "3rd choice";
        const req = rankIdx === 0 ? ' <span class="required-mark">*</span>' : "";
        let optionHtml = '<option value="">' + (rankIdx === 0 ? "Choose…" : "(optional)") + "</option>";
        opts.forEach((base) => {
          optionHtml += '<option value="' + escapeHtml(base) + '"' + (base === current ? " selected" : "") + ">" + escapeHtml(base) + "</option>";
        });
        return (
          '<div class="rank-row"><label>' + label + req + "</label>" +
          '<select class="rank-select" data-slot="' + slot.slot_id + '" data-rank="' + rankIdx + '">' + optionHtml + "</select></div>"
        );
      };
      return (
        '<div class="card" data-slot-card="' + slot.slot_id + '">' +
        '<div class="slot-title">' + slot.day + " — Period " + slot.period + "</div>" +
        rankSelect(0) + rankSelect(1) + rankSelect(2) +
        "</div>"
      );
    }

    function friendDatalistHtml() {
      return otherCampers.map((c) => '<option value="' + escapeHtml(c.name) + '">').join("");
    }

    function friendField(id, label, savedId) {
      const savedName = savedId ? nameFor(savedId) : "";
      return (
        '<div class="rank-row"><label>' + label + "</label>" +
        '<input type="text" list="camper-list" id="' + id + '" value="' + escapeHtml(savedName) + '" placeholder="Start typing a name…"></div>'
      );
    }

    function renderForm() {
      const slots = slotsForCamper();
      const savedFriends = (existing && existing.friend_requests) || [];

      render(
        '<h1>Camp Aaron Elective Selections</h1>' +
        '<div class="sub">' + escapeHtml(me.name) + " · " + escapeHtml(division) + " · Grade " + escapeHtml(me.grade) + "</div>" +
        (existing ? '<div class="msg ok">You already submitted on ' + new Date(existing.submittedAt).toLocaleDateString() + ". You can review and resubmit below — your latest submission replaces the previous one.</div>" : "") +
        (divData.swim_alt_eligible
          ? '<div class="card"><div class="swim-toggle"><input type="checkbox" id="swim-alt-toggle"' + (swimAlt ? " checked" : "") + '><label for="swim-alt-toggle">Opt out of Instructional Swim (Swim Alternative)</label></div></div>'
          : "") +
        '<div id="slot-cards">' + slots.map(slotCard).join("") + "</div>" +
        '<div class="section-title">Friend requests</div>' +
        '<div class="card">' +
        '<div class="friend-help">Friend requests: we\'ll try to place you together for an activity you both pick, when possible. Not guaranteed.</div>' +
        friendField("friend1", "Friend 1", savedFriends[0]) +
        friendField("friend2", "Friend 2", savedFriends[1]) +
        '<div class="friend-help" style="margin-top:14px">Same schedule: only for a mutual request where you BOTH name each other here. If so, we lock your schedules to match wherever your choices overlap — this is a stronger, stricter request than a friend request above.</div>' +
        friendField("sameSchedule", "Same schedule as", existing && existing.same_schedule_request) +
        '<datalist id="camper-list">' + friendDatalistHtml() + "</datalist>" +
        "</div>" +
        '<div id="submit-msg"></div>' +
        '<button class="submit" id="submit-btn">Submit selections</button>'
      );

      const toggle = document.getElementById("swim-alt-toggle");
      if (toggle) {
        toggle.addEventListener("change", () => {
          swimAlt = toggle.checked;
          renderForm();
        });
      }

      document.getElementById("submit-btn").addEventListener("click", onSubmit);
    }

    function resolveFriendField(id) {
      const el = document.getElementById(id);
      const typed = el.value.trim();
      if (!typed) return { ok: true, id: null };
      const match = otherCampers.find((c) => c.name.toLowerCase() === typed.toLowerCase());
      if (!match) return { ok: false, el };
      return { ok: true, id: match.camper_id };
    }

    function onSubmit() {
      const msgEl = document.getElementById("submit-msg");
      msgEl.innerHTML = "";

      // Collect rankings per slot, clearing any prior inline "incomplete" flags.
      document.querySelectorAll("[data-slot-card]").forEach((card) => card.classList.remove("incomplete"));
      const preferences = {};
      let missingFirstChoice = [];
      slotsForCamper().forEach((slot) => {
        const selects = document.querySelectorAll('select[data-slot="' + slot.slot_id + '"]');
        const picks = [];
        selects.forEach((sel) => { if (sel.value) picks.push(sel.value); });
        const deduped = [...new Set(picks)];
        if (deduped.length) preferences[slot.slot_id] = deduped;
        if (!deduped.length) missingFirstChoice.push(slot.day + " P" + slot.period);
      });

      if (missingFirstChoice.length) {
        msgEl.innerHTML = '<div class="msg error">Please choose at least a 1st choice for every period. Missing: ' + missingFirstChoice.join(", ") + "</div>";
        window.scrollTo(0, 0);
        return;
      }

      const f1 = resolveFriendField("friend1");
      const f2 = resolveFriendField("friend2");
      const ss = resolveFriendField("sameSchedule");
      const badField = [f1, f2, ss].find((f) => !f.ok);
      if (badField) {
        msgEl.innerHTML = '<div class="msg error">One of the names you entered doesn\'t match anyone on the roster. Please pick a name from the suggestions as you type.</div>';
        badField.el.focus();
        return;
      }

      const friend_requests = [f1.id, f2.id].filter(Boolean);
      const submitBtn = document.getElementById("submit-btn");
      submitBtn.disabled = true;
      submitBtn.textContent = "Submitting…";

      api("savePreferences", {
        method: "POST",
        body: {
          camper_id: camperId,
          data: JSON.stringify({
            preferences: preferences,
            friend_requests: friend_requests,
            same_schedule_request: ss.id,
            swim_alt: swimAlt,
          }),
        },
      }).then((resp) => {
        if (resp.ok) {
          msgEl.innerHTML = '<div class="msg ok">Submitted! You can revisit this same link any time before the deadline to review or change your answers.</div>';
          window.scrollTo(0, 0);
          submitBtn.textContent = "Submit selections";
          submitBtn.disabled = false;
        } else {
          msgEl.innerHTML = '<div class="msg error">Something went wrong submitting: ' + escapeHtml(resp.error || "unknown error") + "</div>";
          submitBtn.textContent = "Submit selections";
          submitBtn.disabled = false;
        }
      }).catch(() => {
        msgEl.innerHTML = '<div class="msg error">Network error — please check your connection and try again.</div>';
        submitBtn.textContent = "Submit selections";
        submitBtn.disabled = false;
      });
    }

    renderForm();
  }).catch((err) => {
    render('<div class="msg error">Something went wrong loading the form. Please try again shortly.</div>');
    console.error(err);
  });
})();
</script>
</body>
</html>
